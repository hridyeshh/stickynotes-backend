# Local dev database. Credentials are local-only; port 5433 avoids clashing with other projects.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stickynotes
      POSTGRES_PASSWORD: stickynotes
      POSTGRES_DB: stickynotes
    ports:
      - "5433:5432"
    healthcheck: # lets `docker compose up --wait` return only once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U stickynotes"]
      interval: 1s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
